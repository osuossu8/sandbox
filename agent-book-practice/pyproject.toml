[project]
name = "agent-book"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11, <=3.13"
dependencies = [
    "langchain>=0.3.27",
    "langchain-google-vertexai>=2.1.2",
    "langgraph>=0.6.7",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = [
  "B008", # tmp
  "E501", # Line too long (115 > 100)
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
